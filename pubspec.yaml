name: noskipai
description: "Medication adherence app with AI chat support."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0

  # HTTP
  dio: ^5.3.0
  go_router: ^13.0.0
  
  # Storage
  shared_preferences: ^2.2.0
  
  # UI & Design
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0
  
  # Camera & Media
  camera: ^0.10.5+2
  image_picker: ^1.0.4
  
  # Audio/TTS
  flutter_tts: ^0.13.8
  
  # Localization
  intl: ^0.19.0
  
  # Date & Time
  intl_utils: ^1.0.7
  
  # Utils
  provider: ^6.0.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/locales/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
